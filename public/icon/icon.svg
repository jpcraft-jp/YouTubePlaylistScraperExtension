<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="100%" stop-color="#0f0a18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d5bf5"/>
      <stop offset="100%" stop-color="#e0479e"/>
    </linearGradient>
    <linearGradient id="accentSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d5bf5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0479e" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- soft glow -->
  <circle cx="256" cy="256" r="170" fill="url(#accentSoft)" opacity="0.4"/>

  <!-- play button (video/anime) -->
  <circle cx="256" cy="256" r="92" fill="url(#accent)"/>
  <path d="M232 210 L308 256 L232 302 Z" fill="#0f0a18"/>
</svg>
